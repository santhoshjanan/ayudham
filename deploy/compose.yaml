# Production. From this folder, with .env filled in (see .env.example):
#   docker compose up -d --build
# or run ./deploy.sh, which does the same after checking the settings.
#
# The app joins two Docker networks that already exist on your server: your reverse
# proxy's, and the one Postgres and Valkey are on. It publishes no ports. Point your
# proxy at  web:3000  (plain HTTP, WebSockets included). No proxy is configured here.
name: pokerji

x-app: &app
  image: ${POKERJI_IMAGE:-pokerji:latest}
  build:
    context: ..
  pull_policy: never
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  pids_limit: 256
  mem_limit: 512m
  cpus: ${POKERJI_CPUS:-2}
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  web:
    <<: *app
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      VALKEY_URL: ${VALKEY_URL:?set VALKEY_URL}
      ADDRESS_HMAC_SECRET: ${ADDRESS_HMAC_SECRET:?set ADDRESS_HMAC_SECRET}
      # The one origin the app answers to.
      ORIGIN: https://${POKERJI_HOST:?set POKERJI_HOST}
      # The visitor's address is the last entry your proxy wrote in this header.
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: ${XFF_DEPTH:-1}
      # "apply": the app brings its own tables up to date when it starts.
      MIGRATIONS: ${MIGRATIONS:-apply}
      KEY_PREFIX: ${KEY_PREFIX:-pokerji:}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      BACKUP_ROTATION_DAYS: ${BACKUP_ROTATION_DAYS:-}
    # Run exactly one: live rooms are held in its memory.
    networks: [proxy, data]

  # Optional (docs/deploy.md, "Optional hardening"). Only used when you give the app a
  # database user that cannot change tables: this one-shot run then applies migrations.
  migrate:
    <<: *app
    profiles: [migrate]
    restart: 'no'
    environment:
      MIGRATE_ONLY: '1'
      DATABASE_URL: ${MIGRATE_DATABASE_URL:-}
      VALKEY_URL: ${VALKEY_URL:-}
      ADDRESS_HMAC_SECRET: ${ADDRESS_HMAC_SECRET:-}
      KEY_PREFIX: ${KEY_PREFIX:-pokerji:}
    networks: [data]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK}
  data:
    external: true
    name: ${DATA_NETWORK:?set DATA_NETWORK}
