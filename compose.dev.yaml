# Local development and test services only. Production uses the existing
# shared Postgres and Valkey; nothing here is deployed.
#
#   pnpm services:up      start both and wait until healthy
#   pnpm services:down    stop, keep data
#   pnpm services:wipe    stop and delete data
# (each is: docker compose -f compose.dev.yaml ...)
#
# The production file is deploy/compose.yaml.
#
# Ports bind to 127.0.0.1 only. Override ports or passwords in a local .env
# (see .env.example).
name: pokerji-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pokerji
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokerji_dev}
      POSTGRES_DB: pokerji
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pokerji -d pokerji']
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9-alpine
    # No persistence: Valkey holds only rate-limit counters and room locks.
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD:-pokerji_dev}
      - --save
      - ''
      - --appendonly
      - 'no'
    environment:
      VALKEYCLI_AUTH: ${VALKEY_PASSWORD:-pokerji_dev}
    ports:
      - '127.0.0.1:${VALKEY_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
