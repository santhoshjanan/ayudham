# Development: the whole app on this machine.
#
#   docker compose -f compose-dev.yaml up --build
#
# then open http://localhost:5173/poker
# Postgres and Valkey are also reachable on 127.0.0.1 for the test suites.
name: ayudham-dev

services:
  web:
    build:
      context: .
      target: build
    working_dir: /repo/apps/web
    command: node_modules/.bin/vite dev --host 0.0.0.0 --port 5173
    ports:
      - '127.0.0.1:5173:5173'
    environment:
      DATABASE_URL: postgres://ayudham:ayudham_dev@postgres:5432/ayudham
      VALKEY_URL: redis://:ayudham_dev@valkey:6379
      ADDRESS_HMAC_SECRET: development-only-address-hmac-secret
    # Edits to the source show up without a rebuild.
    volumes:
      - ./apps/web/src:/repo/apps/web/src
      - ./apps/web/static:/repo/apps/web/static
      - ./packages/protocol/src:/repo/packages/protocol/src
      - ./packages/poker-engine/src:/repo/packages/poker-engine/src
      - ./packages/poker-server/src:/repo/packages/poker-server/src
      - ./packages/poker-server/migrations:/repo/packages/poker-server/migrations
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ayudham
      POSTGRES_PASSWORD: ayudham_dev
      POSTGRES_DB: ayudham
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ayudham -d ayudham']
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9-alpine
    command: ['valkey-server', '--requirepass', 'ayudham_dev', '--save', '', '--appendonly', 'no']
    environment:
      VALKEYCLI_AUTH: ayudham_dev
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
